<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2f7" />
  <title>N. Chiến</title>
  <meta name="description" content="Trang liên hệ cá nhân N Chiến." />
  <meta name="author" content="N Chiến" />
  <link rel="canonical" href="./" />
  <meta property="og:title" content="N Chiến" />
  <meta property="og:description" content="Trang liên hệ cá nhân N Chiến." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="./" />
  <meta property="og:image" content="./img/social-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="N. Chiến - Trang liên hệ cá nhân" />
  <meta property="og:locale" content="vi_VN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="N Chiến" />
  <meta name="twitter:description" content="Trang liên hệ cá nhân N Chiến." />
  <meta name="twitter:image" content="./img/social-preview.png" />
  <link rel="icon" href="./img/favicon-64.png" type="image/png" sizes="64x64" />
  <link rel="shortcut icon" href="./img/favicon-64.png" type="image/png" />
  <link rel="apple-touch-icon" href="./img/favicon-64.png" />
  <link rel="preload" as="image" href="img/avatar-modal.jpg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/solid.min.css" />
  <link rel="stylesheet" href="./style.css" />
  <script defer src="./script.js"></script>
</head>

<body>
  <main class="page" id="page">
    <section class="profile" aria-label="Trang liên hệ cá nhân">
      <a class="top-btn top-btn--left" href="https://www.facebook.com/nchienms/" aria-label="Mở Facebook">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
      </a>

      <button class="top-btn top-btn--right" id="themeToggle" type="button" aria-label="Đổi giao diện" aria-pressed="false">
        <i class="fa-solid fa-moon theme-icon theme-icon--moon" aria-hidden="true"></i>
        <svg class="theme-icon theme-icon--sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>

      <button class="avatar-wrap" id="openAvatar" type="button" aria-label="Xem ảnh đại diện">
        <img class="avatar" src="img/avatar-modal.jpg" width="120" height="120" alt="Ảnh đại diện N Chiến" decoding="async" fetchpriority="high">
      </button>

      <h1 class="name">Nguyễn Văn Chiến</h1>
      <p class="subtitle">Wait You ^^</p>

      <nav class="grid" aria-label="Liên kết nhanh">
        <a class="icon-btn icon-btn--facebook" href="https://www.facebook.com/nchienms/" target="_blank" rel="noopener" aria-label="Facebook">
          <span class="icon-circle" aria-hidden="true"><img class="brand-icon" src="svg/facebook.svg" width="32" height="32" alt="" decoding="async"></span>
        </a>

        <a class="icon-btn icon-btn--zalo" href="https://zalo.me/0337260123" target="_blank" rel="noopener" aria-label="Zalo">
          <span class="icon-circle" aria-hidden="true"><img class="brand-icon" src="svg/zalo.svg" width="32" height="32" alt="" decoding="async"></span>
        </a>

        <a class="icon-btn icon-btn--tiktok" href="https://vt.tiktok.com/ZSQpF51h/" target="_blank" rel="noopener" aria-label="TikTok">
          <span class="icon-circle" aria-hidden="true"><img class="brand-icon" src="svg/tiktok.svg" width="32" height="32" alt="" decoding="async"></span>
        </a>

        <a class="icon-btn icon-btn--instagram" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
          <span class="icon-circle" aria-hidden="true"><img class="brand-icon" src="svg/instagram.svg" width="32" height="32" alt="" decoding="async"></span>
        </a>

        <button class="icon-btn icon-btn--mb" type="button"
          data-bank="MB Bank" data-owner="NGUYEN VAN CHIEN" data-copy-owner="Nguyễn Văn Chiến" data-account="8266666699" data-qr="img/mbqr.png"
          aria-label="Mở thông tin MB Bank">
          <span class="icon-circle" aria-hidden="true"><img class="brand-icon" src="svg/mb-bank.svg" width="32" height="32" alt="" decoding="async"></span>
        </button>

        <button class="icon-btn icon-btn--vcb" type="button"
          data-bank="Vietcombank" data-owner="NGUYEN VAN CHIEN" data-copy-owner="Nguyễn Văn Chiến" data-account="1020553977" data-qr="img/vcbqr.png"
          aria-label="Mở thông tin Vietcombank">
          <span class="icon-circle" aria-hidden="true"><img class="brand-icon" src="svg/vietcombank.svg" width="32" height="32" alt="" decoding="async"></span>
        </button>
      </nav>

      <div class="actions" aria-label="Hành động">
        <a class="action-btn" href="https://github.com/NChienMS/nextool-config/releases/download/PRINTERNT/N.Chien.vcf"
           target="_blank" rel="noopener">
          <span aria-hidden="true">+</span> Danh bạ
        </a>
        <a class="action-btn" href="tel:0337260123" aria-label="Gọi điện thoại">Gọi điện</a>
      </div>

      <footer class="footer">
        <span aria-hidden="true">♡</span>
        <span>Càng tĩnh lặng bạn càng lắng nghe được nhiều</span>
      </footer>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal" id="avatarModal" aria-hidden="true">
      <button class="modal__overlay" type="button" data-close="avatar" aria-label="Đóng ảnh đại diện"></button>
      <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Ảnh đại diện">
        <button class="modal__close" type="button" data-close="avatar" aria-label="Đóng">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
        <img class="modal__img" src="img/avatar-modal.jpg" width="960" height="960" alt="Ảnh đại diện N Chiến phóng to" loading="lazy" decoding="async">
      </div>
    </div>

    <div class="modal" id="bankModal" aria-hidden="true">
      <button class="modal__overlay" type="button" data-close="bank" aria-label="Đóng thông tin ngân hàng"></button>
      <div class="modal__panel modal__panel--bank" role="dialog" aria-modal="true" aria-labelledby="bankName">
        <button class="modal__close" type="button" data-close="bank" aria-label="Đóng">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>

        <h2 class="bank-title" id="bankName">Ngân hàng</h2>

        <dl class="bank-details">
          <div class="bank-row">
            <dt>Chủ tài khoản</dt>
            <dd id="bankOwnerLabel">NGUYEN VAN CHIEN</dd>
          </div>
          <div class="bank-row">
            <dt>Số tài khoản</dt>
            <dd id="bankAccount">---</dd>
          </div>
        </dl>

        <div class="bank-qr-wrap">
          <img class="bank-qr" id="bankQr" src="" width="300" height="300" alt="QR chuyển khoản" loading="lazy" decoding="async">
        </div>

        <button class="copy-btn" type="button" id="copyAccountBtn">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="9" width="10" height="10" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1" /></svg>
          Sao chép thông tin
        </button>
      </div>
    </div>
  </main>
</body>
</html>
