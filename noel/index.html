<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quét mã QR Code Online</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 30px;
    }
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #ccc;
    }
    .tab {
      margin: 0 20px;
      padding-bottom: 5px;
      cursor: pointer;
    }
    .tab.active {
      color: green;
      font-weight: bold;
      border-bottom: 2px solid green;
    }
    #qr-reader {
      display: none;
      margin: 20px auto;
      width: 300px;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
      font-weight: bold;
    }
    #upload-container, #camera-btn {
      display: none;
      margin-top: 20px;
    }
    .btn {
      padding: 10px 20px;
      background-color: green;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Quét mã QR Code Online</h2>

  <div class="tabs">
    <div id="tab-camera" class="tab active">📷 Máy ảnh quét mã QR</div>
    <div id="tab-upload" class="tab">🖼️ Tải lên hình ảnh mã QR</div>
  </div>

  <div id="camera-btn">
    <button class="btn" onclick="startCameraScan()">🎥 Mở Camera</button>
  </div>
  <div id="qr-reader"></div>

  <div id="upload-container">
    <input type="file" id="qr-file" accept="image/*" />
  </div>

  <div id="result"></div>

  <!-- div ẩn dùng để scan ảnh -->
  <div id="temp-scan" style="display: none;"></div>

  <script>
    const tabCamera = document.getElementById('tab-camera');
    const tabUpload = document.getElementById('tab-upload');
    const qrReader = document.getElementById('qr-reader');
    const uploadContainer = document.getElementById('upload-container');
    const result = document.getElementById('result');
    const fileInput = document.getElementById('qr-file');
    const cameraBtn = document.getElementById('camera-btn');

    let html5QrCode;

    function setTab(active) {
      if (active === 'camera') {
        tabCamera.classList.add('active');
        tabUpload.classList.remove('active');
        uploadContainer.style.display = 'none';
        qrReader.style.display = 'none';
        cameraBtn.style.display = 'block';
        stopCameraScan();
      } else {
        tabUpload.classList.add('active');
        tabCamera.classList.remove('active');
        qrReader.style.display = 'none';
        cameraBtn.style.display = 'none';
        uploadContainer.style.display = 'block';
        stopCameraScan();
      }
      result.innerText = '';
    }

    tabCamera.onclick = () => setTab('camera');
    tabUpload.onclick = () => setTab('upload');

    function startCameraScan() {
      qrReader.style.display = 'block';
      html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        (decodedText) => {
          result.innerText = "✅ Nội dung: " + decodedText;
          html5QrCode.stop().then(() => html5QrCode.clear());
        },
        (errorMessage) => {
          // console.log("Lỗi quét: ", errorMessage);
        }
      );
    }

    function stopCameraScan() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => html5QrCode.clear());
      }
    }

    fileInput.addEventListener("change", (e) => {
      if (e.target.files.length === 0) return;
      const file = e.target.files[0];
      const qrCodeScanner = new Html5Qrcode("temp-scan");
      qrCodeScanner.scanFile(file, true)
        .then(decodedText => {
          result.innerText = "✅ Nội dung: " + decodedText;
          qrCodeScanner.clear();
        })
        .catch(err => {
          result.innerText = "❌ Không đọc được mã QR.";
        });
    });

    // Mặc định dùng camera tab
    setTab('camera');
  </script>

</body>
</html>
