<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quét mã QR Code Online</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
      background-color: #f5f5f5;
      font-size: 16px;
    }
    h2 {
      font-size: 1.5rem;
      margin-bottom: 15px;
    }
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #ccc;
      flex-wrap: wrap;
    }
    .tab {
      flex: 1;
      padding: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      min-width: 120px;
      touch-action: manipulation;
    }
    .tab.active {
      color: green;
      font-weight: bold;
      border-bottom: 2px solid green;
    }
    #qr-reader {
      display: none;
      margin: 15px auto;
      width: 300px;
    }
    #result {
      margin-top: 15px;
      font-size: 1rem;
      color: #333;
      font-weight: bold;
      word-break: break-all;
      padding: 0 10px;
    }
    #upload-container, #camera-btn {
      display: none;
      margin-top: 15px;
    }
    .btn {
      padding: 12px 24px;
      background-color: green;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      min-width: 150px;
      touch-action: manipulation;
    }
    input[type="file"] {
      font-size: 0.9rem;
      padding: 10px;
      width: 90%;
      max-width: 300px;
    }

    /* Media queries cho màn hình nhỏ */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      h2 {
        font-size: 1.2rem;
      }
      .tab {
        font-size: 0.8rem;
        padding: 8px;
      }
      #qr-reader {
        width: 280px;
      }
      .btn {
        padding: 10px 20px;
        font-size: 0.9rem;
      }
      #result {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <h2>Quét mã QR Code Online</h2>

  <div class="tabs">
    <div id="tab-camera" class="tab active">📷 Camera</div>
    <div id="tab-upload" class="tab">🖼️ Tải ảnh</div>
  </div>

  <div id="camera-btn">
    <button class="btn" onclick="startCameraScan()">🎥 Mở Camera</button>
  </div>
  <div id="qr-reader"></div>

  <div id="upload-container">
    <input type="file" id="qr-file" accept="image/*" />
  </div>

  <div id="result"></div>

  <!-- div ẩn dùng để scan ảnh -->
  <div id="temp-scan" style="display: none;"></div>

  <script>
    const tabCamera = document.getElementById('tab-camera');
    const tabUpload = document.getElementById('tab-upload');
    const qrReader = document.getElementById('qr-reader');
    const uploadContainer = document.getElementById('upload-container');
    const result = document.getElementById('result');
    const fileInput = document.getElementById('qr-file');
    const cameraBtn = document.getElementById('camera-btn');

    let html5QrCode;

    function setTab(active) {
      if (active === 'camera') {
        tabCamera.classList.add('active');
        tabUpload.classList.remove('active');
        uploadContainer.style.display = 'none';
        qrReader.style.display = 'none';
        cameraBtn.style.display = 'block';
        stopCameraScan();
      } else {
        tabUpload.classList.add('active');
        tabCamera.classList.remove('active');
        qrReader.style.display = 'none';
        cameraBtn.style.display = 'none';
        uploadContainer.style.display = 'block';
        stopCameraScan();
      }
      result.innerText = '';
    }

    tabCamera.onclick = () => setTab('camera');
    tabUpload.onclick = () => setTab('upload');

    function startCameraScan() {
      qrReader.style.display = 'block';
      html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        (decodedText) => {
          result.innerText = "✅ Kết quả: " + decodedText;
          html5QrCode.stop().then(() => html5QrCode.clear());
        },
        (errorMessage) => {
          result.innerText = "❌ Lỗi: Không quét được mã QR.";
        }
      ).catch(err => {
        result.innerText = "❌ Lỗi: Không thể mở camera.";
      });
    }

    function stopCameraScan() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
      }
    }

    fileInput.addEventListener("change", (e) => {
      if (e.target.files.length === 0) return;
      const file = e.target.files[0];
      const qrCodeScanner = new Html5Qrcode("temp-scan");
      result.innerText = "⏳ Đang quét...";
      qrCodeScanner.scanFile(file, true)
        .then(decodedText => {
          result.innerText = "✅ Kết quả: " + decodedText;
          qrCodeScanner.clear();
        })
        .catch(err => {
          result.innerText = "❌ Lỗi: Không đọc được mã QR.";
        });
    });

    setTab('camera');
  </script>

</body>
</html>
