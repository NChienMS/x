<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import {
      BrowserQRCodeReader
    } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.1/+esm";

    const video = document.getElementById('video');
    const result = document.getElementById('result');
    const fileInput = document.getElementById('file-input');
    const cameraView = document.getElementById('camera-view');
    const uploadView = document.getElementById('upload-view');

    const btnCamera = document.getElementById('btn-camera');
    const btnUpload = document.getElementById('btn-upload');

    const codeReader = new BrowserQRCodeReader();
    let currentStream = null;

    // Mở camera
    btnCamera.onclick = async () => {
      btnCamera.classList.replace("bg-gray-300", "bg-green-600");
      btnCamera.classList.replace("text-black", "text-white");
      btnUpload.classList.replace("bg-green-600", "bg-gray-300");
      btnUpload.classList.replace("text-white", "text-black");

      uploadView.classList.add("hidden");
      cameraView.classList.remove("hidden");
      result.innerText = '';

      try {
        const videoInputDevices = await BrowserQRCodeReader.listVideoInputDevices();
        const selectedDeviceId = videoInputDevices[0]?.deviceId;

        if (!selectedDeviceId) {
          result.innerText = "Không tìm thấy camera nào.";
          return;
        }

        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        codeReader.decodeFromVideoDevice(selectedDeviceId, video, (resultText, _) => {
          if (resultText) {
            result.innerText = "✅ Nội dung: " + resultText;
            codeReader.reset();
          }
        });
      } catch (err) {
        result.innerText = "Lỗi: " + err;
      }
    };

    // Tải ảnh
    btnUpload.onclick = () => {
      btnUpload.classList.replace("bg-gray-300", "bg-green-600");
      btnUpload.classList.replace("text-black", "text-white");
      btnCamera.classList.replace("bg-green-600", "bg-gray-300");
      btnCamera.classList.replace("text-white", "text-black");

      cameraView.classList.add("hidden");
      uploadView.classList.remove("hidden");
      result.innerText = '';

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
    };

    // Đọc ảnh
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = await createImageBitmap(file);
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);

      const codeReader = new BrowserQRCodeReader();
      const resultText = await codeReader.decodeFromCanvas(canvas);

      if (resultText?.text) {
        result.innerText = "✅ Nội dung: " + resultText.text;
      } else {
        result.innerText = "❌ Không đọc được mã QR.";
      }
    };
  </script>
</head>
<body class="bg-gray-100 text-center p-4">

  <h1 class="text-2xl font-bold mb-4">📷 Quét mã QR Code Online</h1>

  <div class="flex justify-center mb-4">
    <button id="btn-camera" class="px-4 py-2 mx-2 bg-green-600 text-white rounded">Máy ảnh</button>
    <button id="btn-upload" class="px-4 py-2 mx-2 bg-gray-300 text-black rounded">Tải ảnh</button>
  </div>

  <!-- Camera View -->
  <div id="camera-view" class="flex justify-center hidden">
    <video id="video" class="rounded shadow-lg" style="width: 300px; height: auto;"></video>
  </div>

  <!-- Upload View -->
  <div id="upload-view" class="hidden">
    <input type="file" id="file-input" accept="image/*" class="block mx-auto mt-4" />
  </div>

  <!-- Result -->
  <div id="result" class="mt-6 text-lg font-semibold text-blue-700"></div>

</body>
</html>
