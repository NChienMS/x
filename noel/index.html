<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đọc mã QR</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 320px;
    }

    button, label {
      width: 100%;
      padding: 12px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      text-align: center;
      box-sizing: border-box;
    }

    label {
      display: inline-block;
      text-align: center;
    }

    button:hover, label:hover {
      background-color: #0056b3;
    }

    #preview {
      margin-top: 10px;
      max-width: 300px;
      max-height: 300px;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      display: none;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      color: green;
      word-wrap: break-word;
      text-align: center;
      max-width: 320px;
    }

    input[type="file"] {
      display: none;
    }

    .reset-btn {
      background-color: #6c757d;
      display: none; /* Ẩn nút Reset ban đầu */
    }

    .reset-btn:hover {
      background-color: #495057;
    }

    .copy-btn {
      margin-left: 10px;
      padding: 8px 12px;
      background-color: #28a745;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .copy-btn:hover {
      background-color: #218838;
    }

    @media (max-width: 480px) {
      button, label {
        font-size: 14px;
        padding: 10px 16px;
      }
      .copy-btn {
        font-size: 12px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>

  <h1>🔍 Trình đọc mã QR</h1>

  <div class="button-group">
    <button id="camera-btn" onclick="startCameraScan()">📷 Quét bằng Camera</button>
    <label id="upload-label" for="upload">🖼️ Tải ảnh lên</label>
    <input type="file" id="upload" accept="image/*" onchange="scanImage(this)" />
    <button id="reset-btn" class="reset-btn" onclick="resetAll()">🔄 Reset</button>
  </div>

  <img id="preview" alt="Ảnh đã chọn" />
  <div id="result">📄 Nội dung QR sẽ hiển thị tại đây...</div>

  <script>
    const resultDiv = document.getElementById('result');
    const previewImg = document.getElementById('preview');
    const cameraBtn = document.getElementById('camera-btn');
    const uploadLabel = document.getElementById('upload-label');
    const resetBtn = document.getElementById('reset-btn');
    let html5QrCode;

    function showResetHideOthers() {
        resetBtn.style.display = 'block';
        cameraBtn.style.display = 'none';
        uploadLabel.style.display = 'none';
    }

    function parseWifiQR(qrCodeMessage) {
        // Regex linh hoạt hơn, hỗ trợ cả thứ tự S:T:P và T:S:P
        const wifiRegex = /^WIFI:.*S:([^;]+);.*P:([^;]*);/;
        const match = qrCodeMessage.match(wifiRegex);
        if (match) {
            const [, ssid, password] = match;
            // Lấy type nếu có, mặc định là "Không xác định"
            const typeMatch = qrCodeMessage.match(/T:([^;]*);/);
            const type = typeMatch ? typeMatch[1] : "Không xác định";
            return { ssid, type, password };
        }
        return null;
    }

    function displayResult(qrCodeMessage) {
        const wifiData = parseWifiQR(qrCodeMessage);
        if (wifiData) {
            resultDiv.innerHTML = `
                ✅ Wi-Fi:<br>
                <strong>Tên Wi-Fi (SSID):</strong> ${wifiData.ssid}<br>
                <strong>Loại bảo mật:</strong> ${wifiData.type}<br>
                <strong>Mật khẩu:</strong> ${wifiData.password} 
                <button class="copy-btn" onclick="copyToClipboard('${wifiData.password}')">Sao chép</button>
            `;
        } else {
            resultDiv.innerHTML = `
                ✅ Nội dung: ${qrCodeMessage}<br>
                <span style="color: red;">Đây không phải QR chứa Wi-Fi</span>
            `;
        }
        showResetHideOthers();
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert("Đã sao chép mật khẩu: " + text);
        }).catch(err => {
            console.error("Lỗi sao chép:", err);
            alert("Không thể sao chép mật khẩu!");
        });
    }

    async function resetReader() {
        try {
            if (html5QrCode) {
                await html5QrCode.stop();
                await html5QrCode.clear();
                html5QrCode = null;
            }
        } catch (err) {
            console.error("Lỗi khi reset reader:", err);
        }
        html5QrCode = new Html5Qrcode("preview");
    }

    function resetAll() {
        location.reload();
    }

    async function startCameraScan() {
        try {
            await resetReader();
            const cameras = await Html5Qrcode.getCameras();
            if (cameras && cameras.length) {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    (qrCodeMessage) => {
                        html5QrCode.stop().catch(err => console.error("Lỗi khi dừng camera:", err));
                        displayResult(qrCodeMessage);
                    },
                    (error) => {
                        console.warn("Lỗi quét:", error);
                    }
                );
            } else {
                alert("Không tìm thấy camera!");
            }
        } catch (err) {
            alert("Không thể truy cập camera: " + err);
            console.error("Lỗi khởi động camera:", err);
        }
    }

    async function scanImage(input) {
        try {
            await resetReader();
            const file = input.files[0];
            if (!file) return;

            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                previewImg.src = e.target.result;
                previewImg.style.display = 'block';
            };
            fileReader.readAsDataURL(file);

            const qr = new Html5Qrcode("preview");
            qr.scanFile(file, true)
                .then(qrCodeMessage => {
                    displayResult(qrCodeMessage);
                })
                .catch(err => {
                    resultDiv.innerText = "❌ Không tìm thấy mã QR trong ảnh.";
                    console.error("Lỗi quét ảnh:", err);
                    showResetHideOthers();
                });
        } catch (err) {
            resultDiv.innerText = "❌ Lỗi khi xử lý ảnh.";
            console.error("Lỗi xử lý ảnh:", err);
            showResetHideOthers();
        }
    }
  </script>

</body>
</html>
